name: onestep

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: onestep
      POSTGRES_USER: onestep
      POSTGRES_PASSWORD: ${DB_PASSWORD:-onestep}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d onestep -U onestep"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/onestep
      DB_PASSWORD: ${DB_PASSWORD:-onestep}
      REDIS_HOST: redis
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
